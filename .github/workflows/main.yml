name: Build project and deploy to FTP server
on:
  push:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build package and deploy to FTP server
    runs-on: windows-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore MSCaddie/MSCaddie.csproj --runtime win-x86

      - name: Debug environment
        shell: bash
        run: |
          echo "Environment: ${{ github.ref_name == 'master' && 'prod' || 'test' }}"
          echo "Branch: ${{ github.ref_name }} "
          echo "WEBSITE_NAME: ${{ vars.WEBSITE_NAME }}"
          echo "COMPUTER_NAME: ${{ vars.COMPUTER_NAME }}"
          echo "WEBSITE_USER: ${{ vars.WEBSITE_USER }}"
          echo "WEBSITE_PWD (masked): ${{ secrets.WEBSITE_PWD }}" | sed 's/./& /g'

      - name: Publish
        shell: bash
        run: |
          dotnet publish MSCaddie/MSCaddie.csproj \
            --configuration Release \
            --framework net8.0 \
            --output publish \
            --runtime win-x86 \
            --no-restore \
            --self-contained true \
            -p:PublishTrimmed=false \
            -p:PublishSingleFile=false

      - name: Deploy to Simply
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ vars.WEBSITE_NAME }}
          server-computer-name:  ${{ vars.COMPUTER_NAME }}
          server-username: ${{ vars.WEBSITE_USER }}
          server-password: ${{ secrets.WEBSITE_PWD }}
          source-path: 'publish'
          target-path: '/'

