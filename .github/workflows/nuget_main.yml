name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'   # Publish only when you push a version tag like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Debug Version
      run: |
        echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
        echo "Version to use: ${GITHUB_REF_NAME#v}"
    
    - name: Pack NuGet package
      run: dotnet pack --configuration Release --no-build --output ./nupkgs /p:Version=${GITHUB_REF_NAME#v}

    - name: Publish package to GitHub Packages
      shell: bash
      run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
